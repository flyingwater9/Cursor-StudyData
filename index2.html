<!DOCTYPE html>  
<html lang="zh-CN">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>英语学情数据看板</title>  
    <!-- 引入 Tailwind CSS -->  
    <script src="https://cdn.tailwindcss.com"></script>  
    <!-- 引入 Chart.js -->  
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>  
    <!-- 引入 FontAwesome 图标 -->  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
      
    <style>  
        body { font-family: 'Inter', 'Helvetica Neue', sans-serif; background-color: #f3f4f6; }  
        /* 自定义滚动条 */  
        ::-webkit-scrollbar { width: 6px; height: 6px; }  
        ::-webkit-scrollbar-track { background: #f1f1f1; }  
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }  
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }  
          
        /* 热力图 Grid 样式 */  
        .heatmap-grid {  
            display: grid;  
            grid-template-rows: repeat(7, 1fr); /* 7天 */  
            grid-auto-flow: column; /* 按列流动 */  
            gap: 4px;  
            height: 120px;  
        }  
        .heatmap-cell {  
            width: 14px;  
            height: 14px;  
            border-radius: 2px;  
            cursor: pointer;  
            transition: transform 0.1s;  
        }  
        .heatmap-cell:hover { transform: scale(1.3); border: 1px solid #666; }  
          
        /* 评分颜色胶囊 */  
        .score-badge-high { @apply bg-green-100 text-green-800; }  
        .score-badge-mid { @apply bg-yellow-100 text-yellow-800; }  
        .score-badge-low { @apply bg-red-100 text-red-800; }  
    </style>  
</head>  
<body class="text-slate-800">  
  
    <!-- 顶部导航与筛选栏 -->  
    <nav class="bg-white shadow-sm sticky top-0 z-20">  
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">  
            <div class="flex justify-between h-16 items-center">  
                <div class="flex items-center gap-2">  
                    <i class="fa-solid fa-graduation-cap text-blue-600 text-2xl"></i>  
                    <span class="font-bold text-xl tracking-tight text-slate-900">EngLearn Data</span>  
                </div>  
                  
                <!-- 全局维度筛选 -->  
                <div class="flex space-x-3">  
                    <!-- 用户维度 -->  
                    <select class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2">  
                        <option selected>学生：张小明 (三年二班)</option>  
                        <option>学生：李华</option>  
                        <option>全班数据聚合</option>  
                    </select>  
                      
                    <!-- 时间维度 -->  
                    <select class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2">  
                        <option selected>最近 3 个月</option>  
                        <option>最近一周</option>  
                        <option>最近一年</option>  
                    </select>  
                </div>  
            </div>  
        </div>  
    </nav>  
  
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">  
  
        <!-- ZONE A: 概览与热力图 -->  
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">  
            <!-- 左侧：核心指标 -->  
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between">  
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Learning Pulse</h3>  
                <div class="grid grid-cols-2 gap-4">  
                    <div>  
                        <p class="text-3xl font-bold text-slate-900">12.5<span class="text-sm text-slate-500 font-normal ml-1">hrs</span></p>  
                        <p class="text-sm text-slate-500">总学习时长</p>  
                    </div>  
                    <div>  
                        <p class="text-3xl font-bold text-slate-900">86<span class="text-sm text-slate-500 font-normal ml-1">days</span></p>  
                        <p class="text-sm text-slate-500">连续打卡</p>  
                    </div>  
                    <div>  
                        <p class="text-3xl font-bold text-blue-600">420</p>  
                        <p class="text-sm text-slate-500">累计单词</p>  
                    </div>  
                    <div>  
                        <p class="text-3xl font-bold text-green-600">92%</p>  
                        <p class="text-sm text-slate-500">平均正确率</p>  
                    </div>  
                </div>  
            </div>  
  
            <!-- 右侧：Github 风格热力图 -->  
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-100">  
                <div class="flex justify-between items-center mb-4">  
                    <h3 class="text-lg font-bold text-slate-800">学习投入度热力图</h3>  
                    <div class="flex items-center gap-2 text-xs text-slate-500">  
                        <span>Less</span>  
                        <span class="w-3 h-3 bg-slate-100 rounded-sm"></span>  
                        <span class="w-3 h-3 bg-blue-200 rounded-sm"></span>  
                        <span class="w-3 h-3 bg-blue-400 rounded-sm"></span>  
                        <span class="w-3 h-3 bg-blue-600 rounded-sm"></span>  
                        <span class="w-3 h-3 bg-blue-800 rounded-sm"></span>  
                        <span>More</span>  
                    </div>  
                </div>  
                <!-- 热力图容器 -->  
                <div class="overflow-x-auto pb-2">  
                    <div id="heatmap-container" class="heatmap-grid"></div>  
                </div>  
                <p class="text-xs text-slate-400 mt-2 text-right">* 颜色深浅代表当日完成模块数量及练习时长</p>  
            </div>  
        </div>  
  
        <!-- ZONE B & C: 进度与趋势分析 -->  
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">  
              
            <!-- 中间：课程进度 -->  
            <div class="lg:col-span-2 space-y-6">  
                <!-- 课程卡片 1 -->  
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">  
                    <div class="flex justify-between items-start mb-4">  
                        <div class="flex items-center gap-3">  
                            <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center text-xl">  
                                <i class="fa-solid fa-school"></i>  
                            </div>  
                            <div>  
                                <h3 class="font-bold text-slate-800">校内同步英语 (三年级上)</h3>  
                                <p class="text-xs text-slate-500">上次学习：2小时前</p>  
                            </div>  
                        </div>  
                        <span class="px-3 py-1 rounded-full text-xs font-medium bg-blue-50 text-blue-600">进行中</span>  
                    </div>  
                      
                    <div class="mb-4">  
                        <div class="flex justify-between text-sm mb-1">  
                            <span class="text-slate-600">总体进度 (Unit 3/6)</span>  
                            <span class="font-bold text-slate-800">45%</span>  
                        </div>  
                        <div class="w-full bg-slate-100 rounded-full h-2.5">  
                            <div class="bg-blue-600 h-2.5 rounded-full" style="width: 45%"></div>  
                        </div>  
                    </div>  
                      
                    <!-- 单元微观状态 -->  
                    <div class="grid grid-cols-3 gap-4 mt-4">  
                        <div class="bg-slate-50 p-3 rounded-lg text-center border border-slate-100">  
                            <p class="text-xs text-slate-500 mb-1">Unit 1</p>  
                            <div class="text-yellow-400 text-xs"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>  
                        </div>  
                        <div class="bg-slate-50 p-3 rounded-lg text-center border border-slate-100">  
                            <p class="text-xs text-slate-500 mb-1">Unit 2</p>  
                            <div class="text-yellow-400 text-xs"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star-half-stroke"></i><i class="fa-regular fa-star"></i></div>  
                        </div>  
                        <div class="bg-blue-50 p-3 rounded-lg text-center border border-blue-100 relative overflow-hidden">  
                            <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>  
                            <p class="text-xs text-slate-500 mb-1">Unit 3</p>  
                            <span class="text-xs font-bold text-blue-600">进行中...</span>  
                        </div>  
                    </div>  
                </div>  
  
                <!-- 课程卡片 2 -->  
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">  
                    <div class="flex justify-between items-start mb-4">  
                        <div class="flex items-center gap-3">  
                            <div class="w-10 h-10 rounded-lg bg-orange-100 text-orange-600 flex items-center justify-center text-xl">  
                                <i class="fa-solid fa-book-open"></i>  
                            </div>  
                            <div>  
                                <h3 class="font-bold text-slate-800">新概念英语 (第一册)</h3>  
                                <p class="text-xs text-slate-500">上次学习：昨天</p>  
                            </div>  
                        </div>  
                    </div>  
                    <div class="w-full bg-slate-100 rounded-full h-2.5 mt-2">  
                        <div class="bg-orange-500 h-2.5 rounded-full" style="width: 20%"></div>  
                    </div>  
                </div>  
            </div>  
  
            <!-- 右侧：能力分布与图表 -->  
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex flex-col gap-6">  
                <div>  
                    <h3 class="font-bold text-slate-800 mb-4">能力维度分析</h3>  
                    <canvas id="radarChart"></canvas>  
                </div>  
                <div class="border-t border-slate-100 pt-4">  
                    <h3 class="font-bold text-slate-800 mb-2">发音趋势</h3>  
                    <canvas id="lineChart" height="150"></canvas>  
                </div>  
            </div>  
        </div>  
  
        <!-- ZONE D: 每日学习明细 (Timeline) -->  
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">  
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">  
                <h3 class="text-lg font-bold text-slate-800" id="timeline-title">今日学习轨迹 (2023-10-25)</h3>  
                <span class="text-sm text-slate-500">共完成 3 个任务模块</span>  
            </div>  
  
            <div class="p-6" id="timeline-content">  
                <!-- 动态生成的时间轴内容放在这里 -->  
                <!-- 示例内容见 JS -->  
            </div>  
        </div>  
  
    </div>  
  
    <!-- JavaScript 逻辑 -->  
    <script>  
        // 1. 模拟数据  
        const mockHeatmapData = generateHeatmapData(90); // 生成过去90天的数据  
          
        // 生成热力图数据工具函数  
        function generateHeatmapData(days) {  
            const data = [];  
            const today = new Date();  
            for (let i = 0; i < days; i++) {  
                const date = new Date(today);  
                date.setDate(date.getDate() - i);  
                // 随机生成 0-4 的活跃度等级  
                const level = Math.random() > 0.2 ? Math.floor(Math.random() * 5) : 0;   
                data.unshift({ date: date.toISOString().split('T')[0], level: level });  
            }  
            return data;  
        }  
  
        // 2. 渲染 Github 风格热力图  
        function renderHeatmap() {  
            const container = document.getElementById('heatmap-container');  
            const levels = ['bg-slate-100', 'bg-blue-200', 'bg-blue-400', 'bg-blue-600', 'bg-blue-800'];  
              
            mockHeatmapData.forEach(day => {  
                const cell = document.createElement('div');  
                cell.className = `heatmap-cell ${levels[day.level]}`;  
                cell.title = `$${day.date}: Level $${day.level}`;  
                // 点击格子交互  
                cell.onclick = () => updateTimeline(day.date, day.level);  
                container.appendChild(cell);  
            });  
        }  
  
        // 3. 更新底部时间轴详情 (Mock Logic)  
        function updateTimeline(dateStr, level) {  
            const container = document.getElementById('timeline-content');  
            const title = document.getElementById('timeline-title');  
            title.innerText = `学习轨迹 (${dateStr})`;  
              
            container.innerHTML = ''; // 清空  
  
            if (level === 0) {  
                container.innerHTML = `<div class="text-center py-8 text-slate-400"><i class="fa-solid fa-bed text-4xl mb-3"></i><p>这一天休息了，没有学习记录。</p></div>`;  
                return;  
            }  
  
            // 模拟生成两条记录  
            const items = [  
                {  
                    time: '19:30',  
                    product: '校内同步',  
                    module: '单词跟读',  
                    color: 'blue',  
                    details: [  
                        { word: 'Elephant', score: 95, status: 'high' },  
                        { word: 'Monkey', score: 88, status: 'high' },  
                        { word: 'Crocodile', score: 55, status: 'low' }  
                    ]  
                },  
                {  
                    time: '20:15',  
                    product: '新概念英语',  
                    module: '课后练习',  
                    color: 'orange',  
                    details: [  
                        { word: 'Unit 2 完形填空', score: '10/10', status: 'high' },  
                        { word: '听写测试', score: '8/10', status: 'mid' }  
                    ]  
                }  
            ];  
  
            items.forEach(item => {  
                const html = `  
                <div class="relative pl-8 pb-8 border-l-2 border-slate-200 last:border-0 last:pb-0">  
                    <div class="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-white border-4 border-${item.color}-500"></div>  
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-2">  
                        <div class="flex items-center gap-3">  
                            <span class="text-sm font-mono text-slate-500">${item.time}</span>  
                            <span class="px-2 py-1 text-xs font-bold text-$${item.color}-700 bg-$${item.color}-100 rounded">${item.product}</span>  
                            <span class="font-semibold text-slate-800">${item.module}</span>  
                        </div>  
                        <button class="text-xs text-blue-600 hover:underline mt-1 sm:mt-0" onclick="this.parentElement.nextElementSibling.classList.toggle('hidden')">  
                            展开/收起详情  
                        </button>  
                    </div>  
                      
                    <!-- 详情区域 (默认展开) -->  
                    <div class="bg-slate-50 rounded-lg p-4 border border-slate-100 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">  
                        ${item.details.map(d => `  
                            <div class="flex justify-between items-center bg-white p-2 rounded shadow-sm border border-slate-100">  
                                <span class="text-sm font-medium text-slate-700">${d.word}</span>  
                                <span class="text-xs font-bold px-2 py-0.5 rounded-full   
                                    ${d.status === 'high' ? 'bg-green-100 text-green-700' :   
                                      d.status === 'low' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}">  
                                    ${d.score}  
                                </span>  
                            </div>  
                        `).join('')}  
                    </div>  
                </div>  
                `;  
                container.insertAdjacentHTML('beforeend', html);  
            });  
        }  
  
        // 4. 初始化图表  
        function initCharts() {  
            // 雷达图  
            new Chart(document.getElementById('radarChart'), {  
                type: 'radar',  
                data: {  
                    labels: ['词汇', '发音', '语法', '听力', '阅读'],  
                    datasets: [{  
                        label: '当前能力值',  
                        data: [85, 90, 70, 80, 75],  
                        fill: true,  
                        backgroundColor: 'rgba(59, 130, 246, 0.2)',  
                        borderColor: 'rgb(59, 130, 246)',  
                        pointBackgroundColor: 'rgb(59, 130, 246)',  
                        pointBorderColor: '#fff',  
                        pointHoverBackgroundColor: '#fff',  
                        pointHoverBorderColor: 'rgb(59, 130, 246)'  
                    }]  
                },  
                options: {  
                    scales: { r: { min: 0, max: 100, ticks: { display: false } } },  
                    plugins: { legend: { display: false } }  
                }  
            });  
  
            // 折线图  
            new Chart(document.getElementById('lineChart'), {  
                type: 'line',  
                data: {  
                    labels: ['M', 'T', 'W', 'T', 'F', 'S', 'S'],  
                    datasets: [{  
                        label: '跟读平均分',  
                        data: [82, 85, 84, 88, 90, 89, 92],  
                        borderColor: 'rgb(16, 185, 129)',  
                        tension: 0.4,  
                        fill: false  
                    }]  
                },  
                options: {  
                    plugins: { legend: { display: false } },  
                    scales: { y: { min: 60, max: 100 } }  
                }  
            });  
        }  
  
        // 页面加载执行  
        window.onload = function() {  
            renderHeatmap();  
            updateTimeline('2023-10-25', 4); // 默认显示某一天的详情  
            initCharts();  
        };  
    </script>  
</body>  
</html>
